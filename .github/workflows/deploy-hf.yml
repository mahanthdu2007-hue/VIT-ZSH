# Deploy to Hugging Face Spaces on every push to main.
# Needs: repository secret HF_TOKEN (write token) and variable HF_SPACE (e.g. "username/prism-engine").
name: Deploy to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Add the Space settings to the top of README
        run: |
          {
            printf -- '---\ntitle: PRISM Engine\nemoji: 🔷\ncolorFrom: indigo\ncolorTo: pink\nsdk: docker\napp_port: 7860\npinned: false\n---\n\n'
            cat README.md
          } > README.hf.md
          mv README.hf.md README.md

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          HF_USER="${HF_SPACE%%/*}"
          rm -rf .git
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy from GitHub ${GITHUB_SHA::7}"
          git push --force "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
