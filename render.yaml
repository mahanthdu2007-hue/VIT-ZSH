# Render Blueprint: one free web service built from the Dockerfile.
services:
  - type: web
    name: prism-engine
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
